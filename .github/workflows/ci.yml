# CI — the "robot" that checks every change before it counts.
# It runs automatically on every Pull Request and on every push to develop.
# Green check = safe to merge. Red X = something's broken (it tells you what).
name: CI

on:
  pull_request:            # run on every PR
  push:
    branches: [develop]    # and on every push to the dev/qa branch
  workflow_dispatch: {}     # ...and a "Run" button in the Actions tab

jobs:
  build-and-test:
    name: Build & test (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven        # reuse downloaded libraries between runs (faster)

      - name: Compile, run tests, package
        # 'verify' compiles the code AND runs the tests. The Spring context test
        # boots the app, so config mistakes (like a duplicate bean) fail HERE,
        # in ~2 minutes, instead of crashing on Render.
        run: ./mvnw -B -ntp verify
