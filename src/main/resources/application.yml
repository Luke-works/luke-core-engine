server:
  # Render injects PORT at runtime; 8080 is the local default
  port: ${PORT:8080}
  # Graceful shutdown (#44): on SIGTERM (Render redeploy/scale-down) stop accepting new
  # connections and let in-flight HTTP requests finish before the JVM exits, instead of
  # cutting them off mid-flight. Bounded by spring.lifecycle.timeout-per-shutdown-phase.
  shutdown: graceful

spring:
  # Upper bound on each shutdown phase: web server drains in-flight requests, then the
  # context closes (which stops the Camunda job executor — it finishes/releases acquired
  # jobs). 30s comfortably covers normal requests without hanging a deploy.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: luke-core-engine
  # Default: H2 in-memory database (no setup needed)
  # To use PostgreSQL, set SPRING_PROFILES_ACTIVE=postgres
  datasource:
    url: ${DB_URL:jdbc:h2:file:./luke-data/luke-engine;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      # SECURE BY DEFAULT (#34): the console is an UNAUTHENTICATED SQL shell (Spring
      # Security permits all; engine auth filters only cover /engine-rest + /api). Off
      # unless a local dev explicitly opts in. Already false in the postgres profile,
      # and H2ConsoleGuard refuses to boot if it's ever enabled under that prod profile.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      # H2 / local dev / tests: Hibernate creates the schema (no Postgres, no Flyway).
      # The postgres profile flips this to `none` and lets Flyway own the luke_* tables (#24).
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  flyway:
    # Disabled here so the H2/test profile keeps using ddl-auto (the V1 baseline is
    # Postgres DDL). Enabled only in application-postgres.yml (#24).
    enabled: false

# CIBSeven / Camunda Engine Configuration
camunda:
  bpm:
    admin-user:
      id: ${CAMUNDA_ADMIN_USER:admin}
      password: ${CAMUNDA_ADMIN_PASSWORD:admin}
      first-name: Admin
      last-name: User
    database:
      schema-update: true
    filter:
      create: All Tasks
    authorization:
      # Enabled so cluster managers (parent_cluster members, via camunda-admin
      # group) get full access while customer tenants are scoped to their own
      # data. New tenants/users created via consumer-ui MUST receive explicit
      # tenant-scoped authorizations on signup or they get a blank app.
      enabled: true
    # history-level DECISION (#29): kept at `full`. The form-intake trace UI
    # (ProcessTraceController) reads historic *variable* values, which `audit`/`activity`
    # do not retain — so `full` is required, not gratuitous. Unbounded growth is instead
    # controlled by the cleanup window below + the 180-day TTL.
    history-level: full
    default-serialization-format: application/json
    auto-deployment-enabled: false
    generic-properties:
      properties:
        # Retention: 180 days. Justified — long enough for form-submission review,
        # audit lookback, and incident investigation, while bounding ACT_HI_* growth
        # well under the basic-256mb / 1GB Postgres plan.
        historyTimeToLive: P180D
        enforceHistoryTimeToLive: false
        # History cleanup (#29): WITHOUT a batch window Camunda's cleanup job never runs,
        # so historyTimeToLive is never enforced and ACT_HI_* grows until the disk fills.
        # Run it nightly 02:00–04:00 (server TZ). removalTimeBased is the performant
        # default strategy: instances get removal_time = endTime + TTL and are purged
        # after it. (History rows written BEFORE this change have a null removal_time and
        # aren't auto-purged; a one-time backfill can set them if needed — negligible on
        # the current small dataset.)
        historyCleanupStrategy: removalTimeBased
        historyCleanupBatchWindowStartTime: "02:00"
        historyCleanupBatchWindowEndTime: "04:00"
        # Colon (:) is allowed so namespaced ids like Clerk consumer users
        # (clerk:<sub>) pass CIBSeven's resource-id validation. Without it,
        # creating user 'clerk:user_…' fails: "is not a valid resource identifier".
        generalResourceWhitelistPattern: "[a-zA-Z0-9_\\-:]+"

# Luke defaults
luke:
  tenant:
    # The "parent cluster" tenant — operations tenant for cluster managers
    # (admin/admin via core-ui-tailadmin). NOT a default for end-user signups;
    # customer organizations create their own tenants via consumer-ui.
    parent-cluster-id: ${LUKE_PARENT_CLUSTER_ID:parent_cluster}
    parent-cluster-name: ${LUKE_PARENT_CLUSTER_NAME:Parent Cluster}
  forms:
    # BPMN process key started for each form submission (deployed per tenant).
    intake-process-key: ${LUKE_FORMS_INTAKE_PROCESS_KEY:FormSubmissionIntakeProcess}
  internal:
    # Shared secret for server-to-server calls into /api/internal/** (e.g.
    # capability-engine starting a process). MUST match capability-engine's
    # value; unset → the internal endpoints reject everything (403).
    shared-secret: ${LUKE_INTERNAL_SHARED_SECRET:}
  capabilities:
    base-url: ${CAPABILITIES_BASE_URL:http://localhost:8082}
    # Operator credential presented to capability-engine on the admin routes
    # (/api/tenants/** — subscriptions + grants). Must match capability-engine's
    # CAPABILITY_OPERATOR_USER/PASSWORD. Unset → no header (capability-engine then
    # leaves those routes open for local dev).
    operator:
      user: ${CAPABILITY_OPERATOR_USER:}
      password: ${CAPABILITY_OPERATOR_PASSWORD:}
  auth:
    # Consumer gateway (luke-auth-engine) trust. When enabled, /engine-rest/*
    # also accepts Bearer act-as-user tokens signed by the gateway, verified
    # against its published JWKS. Disabled by default → Basic-auth only.
    gateway:
      enabled: ${LUKE_AUTH_GATEWAY_ENABLED:false}
      jwks-url: ${LUKE_AUTH_GATEWAY_JWKS_URL:}
      issuer: ${LUKE_AUTH_GATEWAY_ISSUER:luke-auth-engine}
      audience: ${LUKE_AUTH_GATEWAY_AUDIENCE:luke-core-engine}
    # Merged from capability: operator credential the capability OperatorAuthFilter
    # reads for the former admin routes (/api/tenants/**). M2 reconciles this with
    # luke.capabilities.operator. Unset → routes open (local dev).
    operator:
      user: ${CAPABILITY_OPERATOR_USER:}
      password: ${CAPABILITY_OPERATOR_PASSWORD:}
  cors:
    # Comma-separated origin patterns. Local dev default allows any localhost
    # port; in production set ALLOWED_ORIGINS to your deployed UI URLs.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*}

  # ── Merged from luke-capability-engine (forms/email/secrets/embed data store) ──
  # NOTE: capability's JPA default_schema is intentionally dropped — entities now
  # ride core's currentSchema (Strategy A, one schema per env). Do not re-add it.
  core-engine:
    # Used by the form process-start path; becomes a no-op once ProcessStarter
    # goes in-process (M3).
    base-url: ${CORE_ENGINE_BASE_URL:http://localhost:8080}
  embed:
    # HMAC secret for signing/verifying public embed tokens. Set a real value in prod.
    hmac-secret: ${LUKE_EMBED_HMAC_SECRET:dev-embed-secret-change-me}
  email:
    postmark:
      base-url: ${POSTMARK_BASE_URL:https://api.postmarkapp.com}
      account-token: ${POSTMARK_ACCOUNT_TOKEN:}
      server-token: ${POSTMARK_SERVER_TOKEN:}
      default-from: ${EMAIL_DEFAULT_FROM:}
      message-stream: ${POSTMARK_MESSAGE_STREAM:outbound}
    sender:
      base-domain: ${EMAIL_SENDER_BASE_DOMAIN:}
      default-local-part: ${EMAIL_SENDER_DEFAULT_LOCAL_PART:no-reply}
    verification:
      code-length: ${EMAIL_VERIFICATION_CODE_LENGTH:6}
      ttl-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:600}
      max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    otp:
      # Postmark template alias for the one-time-passcode email (published to the
      # platform server on boot by OtpTemplateInstaller). Sent by alias; falls back
      # to an inline render of the same template if the stored one is missing.
      template-alias: ${OTP_TEMPLATE_ALIAS:luke-otp}
      # Brand/product name merged into the OTP email ({{product_name}}).
      product-name: ${EMAIL_PRODUCT_NAME:Lukeflow}
  secrets:
    # AES-256-GCM master keys for the encrypted secret store.
    active-key-id: ${LUKE_SECRETS_ACTIVE_KEY_ID:dev}
    keys:
      dev: ${LUKE_SECRETS_KEY_DEV:dev-secrets-master-key-change-me}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # Expose liveness/readiness groups (#44). Render's healthCheckPath points at
      # /actuator/health/readiness (#36).
      probes:
        enabled: true
      # Readiness (#36): include the datasource so an instance with a down/unreachable
      # DB reports NOT ready (same DB-sensitivity as the old aggregate check, plus drain
      # semantics). During graceful shutdown readinessState flips OUT_OF_SERVICE → the
      # readiness probe goes DOWN → the platform stops routing while requests drain.
      # Liveness stays the default (livenessState only) so a transient DB blip restarts
      # nothing — it only fails readiness, not liveness.
      group:
        readiness:
          include: readinessState,db

# Logging
logging:
  # Tag every log line with the per-request correlation id (set by CorrelationIdFilter,
  # MDC key 'correlationId') so a request can be traced across its log output. '-' when
  # outside a request (startup/background).
  pattern:
    level: "%5p [cid:%X{correlationId:--}]"
  level:
    root: INFO
    com.luke: DEBUG
    org.cibseven: INFO
